# Cách dùng cho người mới:
# docker-compose up -d db   # chỉ bất PostgreSQL, app chạy ngoài bằng uvicorn(khuyên dùng khi học ứng dụng)
# docker compose --profile app up --build    # bật cả app trongcontainer, app chạy trong container 
# docker compose down     # tắt, Giữ dữ liệu
# docker compose down -v  # tắt, xóa dữ liệu
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432" # only reachable from this machine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro   #  chạy một lần khi volume trống
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    
  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Trong container, host của DB là tên service "db", không phải localhost
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
volumes:
  pgdata: